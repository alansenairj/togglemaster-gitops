base-microservice:
  name: flag-service
  port: 8002
  image:
    repository: "897355252206.dkr.ecr.us-east-1.amazonaws.com/togglemaster/flag-service"
    tag: "v1.0.0-9cd5642"
  env:
    # OTLP -> Alloy (namespace monitoring)
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy.monitoring.svc.cluster.local:4317"
    OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    AUTH_SERVICE_URL: "http://auth-service.auth-service.svc.cluster.local:8001"
  ingress:
    path: /flags(/|$)(.*)
  externalSecret:
    enabled: true
    remoteRef: togglemaster/flag
    keys:
      - DATABASE_URL
