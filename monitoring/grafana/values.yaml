# Values do chart grafana. Application: bootstrap/apps/grafana.yaml (repo: Application so aponta o chart).
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password
persistence:
  enabled: false
resources:
  requests: {cpu: 100m, memory: 200Mi}
  limits: {memory: 400Mi}
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    searchNamespace: monitoring
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus-server.monitoring.svc:80
        isDefault: true
        jsonData:
          # scrape real = 60s; sem isto o Grafana assume 15s e $__rate_interval
          # fica em 1m (1 amostra), então rate() volta vazio
          timeInterval: 60s
      - name: Loki
        uid: loki
        type: loki
        url: http://loki.monitoring.svc:3100
        jsonData:
          # log -> trace: o campo trace_id do JSON vira link para o Tempo
          derivedFields:
            - name: trace_id
              matcherRegex: '"trace_id":"(\w+)"'
              url: '$${__value.raw}'
              datasourceUid: tempo
              urlDisplayLabel: Ver trace
      - name: Tempo
        uid: tempo
        type: tempo
        url: http://tempo.monitoring.svc:3200
        jsonData:
          # trace -> log: busca no Loki as linhas com o trace_id do span
          tracesToLogsV2:
            datasourceUid: loki
            filterByTraceID: true
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            tags:
              - key: service.name
                value: app
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
