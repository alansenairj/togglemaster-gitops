# Dashboard de incidente do auth-service, carregado pelo sidecar (label grafana_dashboard).
# Mostra a mesma metrica que dispara o alerta AuthServiceHigh5xxRate, mais replicas e restarts.
# Base: fork christianmilfont/togglemaster-gitops. O JSON e a fonte; editar na UI nao persiste.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-togglemaster-incidente
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  togglemaster-incidente.json: |
    {
      "uid": "togglemaster-incidente",
      "title": "ToggleMaster - Incidente auth-service",
      "tags": ["togglemaster", "incidente"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {"type": "grafana", "uid": "-- Grafana --"},
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Taxa de erro 5xx (5 min)",
          "description": "Mesma consulta da regra AuthServiceHigh5xxRate. Dispara acima de 5%.",
          "gridPos": {"h": 5, "w": 6, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "(sum(rate(traces_span_metrics_calls_total{span_kind=\"SPAN_KIND_SERVER\",status_code=\"STATUS_CODE_ERROR\",service_name=\"auth-service\"}[5m])) or vector(0)) / sum(rate(traces_span_metrics_calls_total{span_kind=\"SPAN_KIND_SERVER\",service_name=\"auth-service\"}[5m])) * 100"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "red", "value": 5}
                ]
              }
            },
            "overrides": []
          },
          "options": {"colorMode": "background", "graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"]}}
        },
        {
          "id": 2,
          "type": "alertlist",
          "title": "Estado do alerta",
          "gridPos": {"h": 5, "w": 6, "x": 6, "y": 0},
          "options": {
            "alertName": "AuthServiceHigh5xxRate",
            "showInstances": false,
            "viewMode": "list",
            "groupMode": "default",
            "maxItems": 5,
            "sortOrder": 1,
            "stateFilter": {"firing": true, "pending": true, "normal": true, "noData": true, "error": true}
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Replicas disponiveis / desejadas",
          "gridPos": {"h": 5, "w": 6, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "legendFormat": "disponiveis",
              "expr": "sum(kube_deployment_status_replicas_available{namespace=\"auth-service\",deployment=\"auth-service\"})"
            },
            {
              "refId": "B",
              "legendFormat": "desejadas",
              "expr": "sum(kube_deployment_spec_replicas{namespace=\"auth-service\",deployment=\"auth-service\"})"
            }
          ],
          "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}}
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Restarts de pod (1h)",
          "description": "Sobe quando um pod reinicia.",
          "gridPos": {"h": 5, "w": 6, "x": 18, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"auth-service\"}[1h])) or vector(0)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 1},
                  {"color": "red", "value": 3}
                ]
              }
            },
            "overrides": []
          },
          "options": {"colorMode": "background", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}}
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Taxa de erro 5xx vs limite de 5%",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 5},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "legendFormat": "5xx %",
              "expr": "(sum(rate(traces_span_metrics_calls_total{span_kind=\"SPAN_KIND_SERVER\",status_code=\"STATUS_CODE_ERROR\",service_name=\"auth-service\"}[$__rate_interval])) or vector(0)) / sum(rate(traces_span_metrics_calls_total{span_kind=\"SPAN_KIND_SERVER\",service_name=\"auth-service\"}[$__rate_interval])) * 100"
            },
            {
              "refId": "B",
              "legendFormat": "limite do alerta",
              "expr": "vector(5)"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "percent", "min": 0},
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "limite do alerta"},
                "properties": [
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}},
                  {"id": "custom.lineStyle", "value": {"fill": "dash", "dash": [10, 10]}},
                  {"id": "custom.fillOpacity", "value": 0}
                ]
              }
            ]
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Requisicoes por segundo",
          "description": "O alerta so avalia com mais de 0,05 req/s (guarda de trafego).",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 5},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "legendFormat": "total",
              "expr": "sum(rate(traces_span_metrics_calls_total{span_kind=\"SPAN_KIND_SERVER\",service_name=\"auth-service\"}[$__rate_interval]))"
            },
            {
              "refId": "B",
              "legendFormat": "com erro",
              "expr": "sum(rate(traces_span_metrics_calls_total{span_kind=\"SPAN_KIND_SERVER\",status_code=\"STATUS_CODE_ERROR\",service_name=\"auth-service\"}[$__rate_interval])) or vector(0)"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "reqps", "min": 0}, "overrides": []}
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Latencia p95",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 13},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "legendFormat": "p95",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(traces_span_metrics_duration_milliseconds_bucket{span_kind=\"SPAN_KIND_SERVER\",service_name=\"auth-service\"}[$__rate_interval])))"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "ms", "min": 0}, "overrides": []}
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Restarts por pod",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 13},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{pod}}",
              "expr": "kube_pod_container_status_restarts_total{namespace=\"auth-service\"}"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "min": 0}, "overrides": []}
        },
        {
          "id": 9,
          "type": "logs",
          "title": "Logs de erro do auth-service",
          "description": "Clique em trace_id para abrir o trace no Tempo.",
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 21},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"auth-service\"} | detected_level=~\"error|warn\""
            }
          ],
          "options": {"showTime": true, "wrapLogMessage": true, "enableLogDetails": true, "sortOrder": "Descending"}
        }
      ]
    }
