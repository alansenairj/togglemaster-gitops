# Dashboard carregado pelo sidecar do Grafana (label grafana_dashboard).
# O JSON e a fonte; editar na UI nao persiste (storage em emptyDir).
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-togglemaster-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  togglemaster-overview.json: |
    {
      "uid": "togglemaster-overview",
      "title": "ToggleMaster — Cluster, Serviços e Logs",
      "schemaVersion": 39,
      "version": 1,
      "tags": [
        "togglemaster"
      ],
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "app",
            "label": "app",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "query": {
              "label": "app",
              "refId": "LokiVariableQueryEditor-VariableQuery",
              "stream": "",
              "type": 1
            },
            "includeAll": true,
            "allValue": ".+",
            "multi": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2
          },
          {
            "name": "level",
            "label": "level",
            "type": "custom",
            "query": "info,warn,error,debug,.*",
            "includeAll": false,
            "current": {
              "text": ".*",
              "value": ".*"
            },
            "options": []
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Capacidade do cluster",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Nós Ready",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Pods Pending",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_phase{phase=\"Pending\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Nós com MemoryPressure",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_node_status_condition{condition=\"MemoryPressure\",status=\"true\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Restarts (1h)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(kube_pod_container_status_restarts_total[1h]))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Pods Running",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_phase{phase=\"Running\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "CPU usada por nó (%)",
          "description": "Uso real (node-exporter).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100,
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100",
              "legendFormat": "{{instance}}"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Memória usada por nó (%)",
          "description": "Uso real. Acima de ~85% há risco de pressão de memória.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 5,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100,
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100",
              "legendFormat": "{{instance}}"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Disco / usado por nó (%)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 5,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100,
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(1 - node_filesystem_avail_bytes{mountpoint=\"/\",fstype!=\"rootfs\"} / node_filesystem_size_bytes{mountpoint=\"/\",fstype!=\"rootfs\"}) * 100",
              "legendFormat": "{{instance}}"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "CPU reservada (requests) / alocável (%)",
          "description": "Decide se um pod novo entra no nó (scheduler usa requests).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100,
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (node) (kube_pod_container_resource_requests{resource=\"cpu\"}) / sum by (node) (kube_node_status_allocatable{resource=\"cpu\"}) * 100",
              "legendFormat": "{{node}}"
            }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Memória reservada (requests) / alocável (%)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 13,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100,
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (node) (kube_pod_container_resource_requests{resource=\"memory\"}) / sum by (node) (kube_node_status_allocatable{resource=\"memory\"}) * 100",
              "legendFormat": "{{node}}"
            }
          ]
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Pods por nó / limite (%)",
          "description": "t3.medium aceita 17 pods por nó.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 13,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100,
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count by (node) (kube_pod_info) / sum by (node) (kube_node_status_allocatable{resource=\"pods\"}) * 100",
              "legendFormat": "{{node}}"
            }
          ]
        },
        {
          "id": 13,
          "type": "row",
          "title": "Serviços (spanmetrics via Alloy)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 21,
            "w": 24,
            "h": 1
          }
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Requisições/s por serviço",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 22,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (service_name) (rate(traces_span_metrics_calls_total{span_kind=\"SPAN_KIND_SERVER\"}[1m]))",
              "legendFormat": "{{service_name}}"
            }
          ]
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Erros 5xx (%) por serviço",
          "description": "Base do alerta: auth-service > 5%.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 22,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100,
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (service_name) (rate(traces_span_metrics_calls_total{span_kind=\"SPAN_KIND_SERVER\",status_code=\"STATUS_CODE_ERROR\"}[5m])) / sum by (service_name) (rate(traces_span_metrics_calls_total{span_kind=\"SPAN_KIND_SERVER\"}[5m])) * 100",
              "legendFormat": "{{service_name}}"
            }
          ]
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "Latência p95 por serviço",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 22,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le, service_name) (rate(traces_span_metrics_duration_milliseconds_bucket{span_kind=\"SPAN_KIND_SERVER\"}[5m])))",
              "legendFormat": "{{service_name}}"
            }
          ]
        },
        {
          "id": 17,
          "type": "row",
          "title": "Logs",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 30,
            "w": 24,
            "h": 1
          }
        },
        {
          "id": 18,
          "type": "logs",
          "title": "Logs ($app)",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 31,
            "w": 24,
            "h": 12
          },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "enableLogDetails": true,
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{app=~\"$app\"} | json | level=~\"$level\""
            }
          ]
        }
      ]
    }
