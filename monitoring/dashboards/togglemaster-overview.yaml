# Dashboard carregado pelo sidecar do Grafana (label grafana_dashboard).
# O JSON e a fonte; editar na UI nao persiste (storage em emptyDir).
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-togglemaster-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  togglemaster-overview.json: |
    {
      "uid": "togglemaster-overview",
      "title": "ToggleMaster — Saúde, Logs e Capacidade",
      "description": "Fluxo de operação: 1) está quebrado? (RED/SLO) 2) por quê? (logs/traces) 3) workloads 4) capacidade (USE).",
      "schemaVersion": 39,
      "version": 2,
      "tags": [
        "togglemaster",
        "sre"
      ],
      "timezone": "browser",
      "graphTooltip": 1,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "service",
            "label": "Métricas ▸ serviço",
            "description": "Filtra os painéis de saúde (RED/SLO). Não afeta os logs.",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(traces_span_metrics_calls_total, service_name)",
            "includeAll": true,
            "multi": true,
            "refresh": 2,
            "sort": 1,
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            }
          },
          {
            "name": "ns",
            "label": "Logs ▸ namespace",
            "description": "Filtra só a seção de logs. Padrão: os 4 serviços.",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(kube_pod_info, namespace)",
            "includeAll": true,
            "multi": true,
            "refresh": 2,
            "sort": 1,
            "current": {
              "text": [
                "auth-service",
                "evaluation-service",
                "flag-service",
                "targeting-service"
              ],
              "value": [
                "auth-service",
                "evaluation-service",
                "flag-service",
                "targeting-service"
              ]
            }
          },
          {
            "name": "nivel",
            "label": "Logs ▸ nível",
            "description": "Filtra só a seção de logs.",
            "type": "custom",
            "query": "error,warn,info,debug,unknown",
            "includeAll": true,
            "multi": true,
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            }
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 101,
          "type": "row",
          "title": "1 · Saúde dos serviços — golden signals e SLO (99% de disponibilidade)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          }
        },
        {
          "id": 102,
          "type": "stat",
          "title": "Disponibilidade (5m)",
          "description": "SLI: 1 − (spans SERVER com erro / total). SLO 99%.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "area"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "noValue": "sem tráfego",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 99
                  }
                ]
              },
              "decimals": 2
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(1 - (sum(rate(traces_span_metrics_calls_total{span_kind=\"SPAN_KIND_SERVER\",status_code=\"STATUS_CODE_ERROR\",service_name=~\"$service\"}[5m])) or vector(0)) / sum(rate(traces_span_metrics_calls_total{span_kind=\"SPAN_KIND_SERVER\",service_name=~\"$service\"}[5m]))) * 100",
              "instant": false
            }
          ]
        },
        {
          "id": 103,
          "type": "stat",
          "title": "Requisições/s",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "area"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "noValue": "sem tráfego",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "decimals": 2
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(traces_span_metrics_calls_total{span_kind=\"SPAN_KIND_SERVER\",service_name=~\"$service\"}[5m]))",
              "instant": false
            }
          ]
        },
        {
          "id": 104,
          "type": "stat",
          "title": "Erros 5xx (5m)",
          "description": "Spans SERVER com status ERROR (5xx). 4xx não conta.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "area"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "noValue": "sem tráfego",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              },
              "decimals": 2
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(sum(rate(traces_span_metrics_calls_total{span_kind=\"SPAN_KIND_SERVER\",status_code=\"STATUS_CODE_ERROR\",service_name=~\"$service\"}[5m])) or vector(0)) / sum(rate(traces_span_metrics_calls_total{span_kind=\"SPAN_KIND_SERVER\",service_name=~\"$service\"}[5m])) * 100",
              "instant": false
            }
          ]
        },
        {
          "id": 105,
          "type": "stat",
          "title": "Latência p95 (5m)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "area"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "noValue": "sem tráfego",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 500
                  },
                  {
                    "color": "red",
                    "value": 1000
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(traces_span_metrics_duration_milliseconds_bucket{span_kind=\"SPAN_KIND_SERVER\",service_name=~\"$service\"}[5m])))",
              "instant": false
            }
          ]
        },
        {
          "id": 106,
          "type": "stat",
          "title": "Burn rate do erro (1h)",
          "description": "Velocidade de consumo do error budget (SLO 99%). >1 consome mais rápido que o permitido; >14,4 gasta 2% do mês em 1h (página).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "area"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "sem tráfego",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 14.4
                  }
                ]
              },
              "decimals": 2
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(sum(rate(traces_span_metrics_calls_total{span_kind=\"SPAN_KIND_SERVER\",status_code=\"STATUS_CODE_ERROR\",service_name=~\"$service\"}[1h])) or vector(0)) / sum(rate(traces_span_metrics_calls_total{span_kind=\"SPAN_KIND_SERVER\",service_name=~\"$service\"}[1h])) / 0.01",
              "instant": false
            }
          ]
        },
        {
          "id": 107,
          "type": "stat",
          "title": "Restarts de containers (1h)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 20,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
