# Values do chart tempo. Application: bootstrap/apps/tempo.yaml (repo: Application so aponta o chart).
tempo:
  retention: 24h
  reportingEnabled: false
  resources:
    requests: {cpu: 150m, memory: 384Mi}
    limits: {memory: 768Mi}
  # Gerador so com local_blocks: serve apenas a aba Rate/TraceQL metrics do
  # Explore. Spanmetrics e grafo de servicos sao gerados no Alloy (coletor).
  metricsGenerator:
    enabled: true
    remoteWriteUrl: "http://prometheus-server.monitoring.svc/api/v1/write"
    processor:
      local_blocks:
        flush_to_storage: true
        filter_server_spans: false
  overrides:
    defaults:
      metrics_generator:
        processors: [local-blocks]
persistence:
  enabled: false
