# ClusterSecretStore e outros recursos de plataforma que sao nossos (nao vem
# de chart de terceiro). Diretorio simples, sem kustomize.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alansenairj/togglemaster-gitops.git
    targetRevision: main
    path: platform
    directory:
      exclude: README.md
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
