# Traces. Single binary, storage local em emptyDir (sem EBS CSI).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: monitoring
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: 1.24.4
    helm:
      releaseName: tempo
      valuesObject:
        tempo:
          retention: 24h
          reportingEnabled: false
          resources:
            requests: {cpu: 150m, memory: 384Mi}
            limits: {memory: 768Mi}
          # Gerador de metricas: unica fonte de grafo de servicos, spanmetrics e
          # TraceQL metrics (aba Rate/Explore). Escreve no Prometheus por remote write.
          metricsGenerator:
            enabled: true
            remoteWriteUrl: "http://prometheus-server.monitoring.svc/api/v1/write"
            processor:
              local_blocks:
                flush_to_storage: true
                filter_server_spans: false
              service_graphs:
                dimensions: [http.method, http.route]
                enable_virtual_node_label: true
                peer_attributes: [peer.service, db.name, db.system, server.address, messaging.system]
              span_metrics:
                dimensions: [http.method, http.route, http.status_code, http.response.status_code]
                enable_target_info: true
          overrides:
            defaults:
              metrics_generator:
                processors: [service-graphs, span-metrics, local-blocks]
        persistence:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
