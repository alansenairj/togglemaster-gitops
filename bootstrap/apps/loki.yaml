# Logs de todos os pods. SingleBinary com filesystem em emptyDir (sem EBS CSI).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.5.0
    helm:
      releaseName: loki
      valuesObject:
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          limits_config:
            retention_period: 24h
        singleBinary:
          replicas: 1
          persistence:
            enabled: false
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
        write: {replicas: 0}
        read: {replicas: 0}
        backend: {replicas: 0}
        ingester: {replicas: 0}
        querier: {replicas: 0}
        queryFrontend: {replicas: 0}
        queryScheduler: {replicas: 0}
        distributor: {replicas: 0}
        compactor: {replicas: 0}
        indexGateway: {replicas: 0}
        bloomCompactor: {replicas: 0}
        bloomGateway: {replicas: 0}
        chunksCache: {enabled: false}
        resultsCache: {enabled: false}
        gateway: {enabled: false}
        lokiCanary: {enabled: false}
        test: {enabled: false}
        minio: {enabled: false}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
