# Metricas de cluster (cadvisor, kube-state-metrics, node-exporter) e spanmetrics
# vindas do Alloy via remote write. Sem PVC: o cluster nao tem EBS CSI (emptyDir).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.40.3
    helm:
      releaseName: prometheus
      valuesObject:
        alertmanager:
          enabled: false
        prometheus-pushgateway:
          enabled: false
        server:
          retention: 24h
          persistentVolume:
            enabled: false
          extraFlags:
            - web.enable-lifecycle
            - web.enable-remote-write-receiver
          resources:
            requests: {cpu: 100m, memory: 400Mi}
            limits: {memory: 800Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
