# Metricas de cluster (cadvisor, kube-state-metrics, node-exporter) e spanmetrics
# vindas do Alloy via remote write. Sem PVC: o cluster nao tem EBS CSI (emptyDir).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: monitoring
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus
      targetRevision: 29.40.3
      helm:
        releaseName: prometheus
        valueFiles:
          - $values/monitoring/prometheus/values.yaml
    - repoURL: https://github.com/alansenairj/togglemaster-gitops.git
      targetRevision: main
      ref: values
