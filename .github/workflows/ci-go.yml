name: CI Go (reusable)

# Vive em alansenairj/togglemaster-gitops/.github/workflows/
# Chamado pelos repos Go: auth-service, evaluation-service.
#
# Fase 1 e 2 do pipeline. Tudo aqui depende da linguagem. O que nao depende
# (docker, ECR, GitOps) esta em cd-container.yml.
#
# Polyrepo: o repositorio E o servico, entao o codigo esta na raiz. Sem
# working-directory e sem prefixo de diretorio nos caminhos.

on:
  workflow_call:
    inputs:
      go_version:
        required: false
        type: string
        default: "1.21"

permissions:
  contents: read

jobs:
  test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cache L1: setup-go restaura ~/.cache/go-build e o module cache a partir
      # do hash do go.sum.
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache-dependency-path: go.sum

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -race -cover

  lint:
    name: Linter / Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache-dependency-path: go.sum

      # go vet bloqueia: pega erro real (printf malformado, lock copiado) e nao
      # produz falso positivo de estilo.
      - name: go vet
        run: go vet ./...

      # golangci-lint roda informativo. O codigo herdado da Fase 2 ignora erros
      # de Encode/Close; bloquear deixaria o pipeline vermelho sem relacao com a
      # mudanca do commit. Passar para bloqueante quando o backlog zerar.
      - name: golangci-lint (informativo)
        continue-on-error: true
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v1.64.8
          "$(go env GOPATH)/bin/golangci-lint" run --timeout=5m ./...

  sec:
    name: Security Scan (SAST + SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache-dependency-path: go.sum

      # SAST. HIGH bloqueia — e o gate usado na demo de falha do video
      # (gosec G204: exec.Command com entrada concatenada).
      #
      # G704 excluido: a taint analysis marca SSRF em a.HttpClient.Do(req) no
      # evaluation-service, mas as URLs vem de FLAG_SERVICE_URL e
      # TARGETING_SERVICE_URL (env/ConfigMap), nunca de entrada do usuario.
      # Sem a exclusao o gate barra os dois servicos Go em todo commit.
      - name: gosec (SAST) — bloqueia em HIGH
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -severity high -confidence medium -exclude=G704 ./...

      - name: gosec — relatorio completo, inclui G704 (informativo)
        continue-on-error: true
        run: gosec -severity medium ./...

      # SCA. ignore-unfixed evita travar em CVE sem correcao publicada: nesse
      # caso nao ha acao possivel no commit.
      - name: Trivy fs (SCA) — bloqueia em CRITICAL
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy fs — relatorio HIGH/MEDIUM (informativo)
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,MEDIUM
          exit-code: "0"
          format: table
