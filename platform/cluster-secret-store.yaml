# ClusterSecretStore: aponta o ESO para o AWS Secrets Manager. Autenticacao via
# IRSA — a role vem do output eso_role_arn do Terraform e e anotada na
# ServiceAccount do ESO (ver bootstrap/apps/external-secrets.yaml).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
